version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compute_bazaar_app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=default_computebazaar_key_for_docker
      - PORT=8000
    volumes:
      - db_data:/app
    restart: always

volumes:
  db_data:
