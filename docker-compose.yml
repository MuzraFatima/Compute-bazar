version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compute_bazaar_app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=default_computebazaar_key_for_docker
      - PORT=8000
      - DATABASE_URL=sqlite:////app/data/compute_bazaar.db
    volumes:
      # Mount only the data directory — do NOT mount /app so source code stays intact
      - db_data:/app/data
    restart: always

volumes:
  db_data:
