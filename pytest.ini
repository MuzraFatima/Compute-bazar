[pytest]
# ── Compute Bazaar 2.0 — Pytest Configuration ─────────────────
# Registers custom markers to avoid PytestUnknownMarkWarning

markers =
    live: Tests that require a real GROQ_API_KEY and make live LLM API calls.
          These are skipped automatically in CI when the key is absent.

# Show compact test progress
addopts = -p no:cacheprovider
